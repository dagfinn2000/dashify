services:
  dashify:
    build: .
    container_name: dashify
    restart: unless-stopped
    init: true               # forward signals & reap zombies for clean shutdowns
    ports:
      - "6969:6969"
    volumes:
      # Mount your config directory so edits are picked up live without rebuilding
      - ./config:/app/config:ro
    # Load secrets (e.g. widget API passwords) from a local .env file into the
    # container, then reference them in config.yaml as ${VAR}. Copy .env.example
    # to .env and fill it in — .env is gitignored so secrets stay off GitHub.
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=6969
      # Optional: set TZ for correct timestamps
      # - TZ=Europe/Oslo
