<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#13151f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#e8edf5" media="(prefers-color-scheme: light)" />
  <title>Dashify</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236c8ef7'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230f1117'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%234ade80'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('dashify-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.className = 'theme-' + t;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-text">
        <h1 id="site-title">Dashify</h1>
        <p id="site-subtitle"></p>
      </div>
      <div class="header-meta">
        <span id="status-summary" class="status-summary" aria-live="polite"></span>
        <input
          id="filter"
          class="filter"
          type="search"
          placeholder="Filter…  (/)"
          aria-label="Filter services"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="last-updated" aria-live="polite"></span>
        <button id="palette-btn" class="icon-btn" type="button" aria-label="Customize colours" title="Customize colours">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="17" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7" r="1.2" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.83-.44-1.12-.27-.29-.44-.66-.44-1.13A1.64 1.64 0 0 1 14.43 16.4h1.96C19.43 16.4 22 13.83 22 10.69 22 5.93 17.52 2 12 2z"/></svg>
        </button>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
        <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh status" title="Refresh status">↻</button>
      </div>
    </div>
  </header>

  <main>
    <div id="groups-container"></div>
  </main>

  <footer>
    <span>Dashify · Edit <code>config/config.yaml</code> to customize</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
