# Dashify Configuration
# Edit this file to customize your dashboard.
# Changes are picked up automatically without restarting.

title: "My Dashboard"
subtitle: "Home Lab"       # optional subtitle shown below the title
theme: dark                # dark | light | auto (follow the browser/OS preference)
refresh_interval: 30       # seconds between status re-checks (set to 0 to disable)
columns: 3                 # number of service group columns (1-4)
timeout: 5                 # default health-check timeout in seconds (per-service override below)
status_cache_ttl: 5        # seconds the server caches results so open tabs share one check

# RSS / Atom feeds shown in a pane to the left of your cards. You can also add
# and remove feeds live from the dashboard (saved in your browser); these seed
# the pane on first load. Each entry is a feed URL (or { url: ... }).
# rss:
#   - https://news.ycombinator.com/rss
#   - https://www.theverge.com/rss/index.xml
# rss_item_limit: 6          # max items shown per feed (1-20)
# rss_cache_ttl: 300         # seconds the server caches each fetched feed

# Icons resolve automatically from https://github.com/homarr-labs/dashboard-icons
# based on each service's name — no need to set an icon for common services.
# Override per service with `icon:` (a slug like "pi-hole", an emoji, a URL, or a
# local file dropped in this config/ folder). icon_format picks the asset type.
icon_format: svg           # svg | png | webp

# Optional background image for the whole dashboard. Use a URL, or drop an image
# into this config/ folder and reference it by filename (served from /user/).
# background: "background.jpg"
# background_dim: 0.5      # 0-1 scrim over the image so text stays readable
# background_blur: 0       # px of blur applied to the background image

# Card appearance. Make cards translucent (nice over a background image) and
# optionally frost them with a backdrop blur.
# card_opacity: 1          # 0 (fully transparent) .. 1 (solid, default)
# card_blur: 0             # px backdrop blur behind translucent cards

# Custom colours. Override any theme variable; provide a flat map (applies to
# both themes) or separate `dark:`/`light:` maps. Keys: bg, bg-card,
# bg-card-hover, border, text, text-muted, text-dim, accent, up, down, header-bg.
# colors:
#   accent: "#f59e0b"
#   dark:
#     bg: "#0b0e14"
#   light:
#     bg: "#eef2f7"

# Groups contain your services and quick links.
# Each group appears as a card column on the dashboard.
# A group may set `width:` to span multiple columns (1-4); you can also drag the
# right edge of any card to resize it, and your sizes are remembered per browser.
groups:
  - name: "Media"
    # width: 2               # span two columns
    services:
      - name: "Jellyfin"
        url: "http://192.168.1.100:8096"
        description: "Media server"
        check: true            # perform HTTP health check
        check_path: "/health"  # optional: override the path used for health checks

      - name: "Plex"
        url: "http://192.168.1.100:32400"
        description: "Media server"
        check: true

      - name: "Navidrome"
        url: "http://192.168.1.100:4533"
        description: "Music streaming"
        check: true

  - name: "Infrastructure"
    services:
      - name: "Portainer"
        url: "http://192.168.1.100:9000"
        description: "Container management"
        check: true

      - name: "Proxmox"
        url: "https://192.168.1.10:8006"
        description: "Hypervisor"
        check: true
        allow_insecure: true   # accept the self-signed TLS certificate
        # icon: proxmox        # optional: force a specific dashboard-icons slug
        # timeout: 10          # optional: per-service timeout override (seconds)
        # method: HEAD         # optional: HTTP method for the check (default GET)
        # expect_status: 200   # optional: require an exact status code instead of <400

      - name: "Grafana"
        url: "http://192.168.1.100:3000"
        description: "Metrics & dashboards"
        check: true

  - name: "Network"
    services:
      - name: "Pi-hole"
        url: "http://192.168.1.1/admin"
        icon: pihole           # keyword aliases resolve to the right slug (pi-hole)
        description: "DNS ad blocker"
        check: true
        # Live stats on the card (queries / blocked / %). Works with Pi-hole v6
        # and v5. The key (v6 app password or v5 API token) stays on the server
        # and is never sent to the browser.
        widget:
          type: pihole
          url: "http://192.168.1.1"   # base URL, without /admin
          key: "${PIHOLE_PASSWORD}"   # from .env (see .env.example) — not committed

      - name: "Nginx Proxy Manager"
        url: "http://192.168.1.100:81"
        description: "Reverse proxy"
        check: true
        widget:
          type: npm
          username: "admin@example.com"
          password: "${NPM_PASSWORD}"   # from .env (see .env.example)

      - name: "Uptime Kuma"
        url: "http://192.168.1.100:3001"
        description: "Uptime monitor"
        check: true
