# ─────────────────────────────────────────────────────────────────────────────
# Dashify — annotated example RSS / Atom configuration
#
# Reference for the feeds shown in the pane to the left of your cards. The app
# reads `config/RSS.yaml`; copy what you want into that file (or rename this one).
#
# These entries just SEED the pane on first load — you can also add and remove
# feeds live from the dashboard (those are saved per browser). Both RSS 2.0 and
# Atom are supported. Edits apply live; no restart needed.
# ─────────────────────────────────────────────────────────────────────────────

# A list of feed URLs. Each entry may be a bare URL or written as { url: ... }.
feeds:
  - https://news.ycombinator.com/rss
  - https://www.theverge.com/rss/index.xml
  # - { url: https://example.com/atom.xml }

item_limit: 6      # max items shown per feed (1–20)
cache_ttl: 300     # seconds the server caches each fetched feed
